      - name: Build the tested local server
        run: npm run build
      - name: 20 concurrent fictional users for ten minutes; no browser phase
        run: npm run test:market:docker
      - name: Stop only this project and remove connection credentials
        if: always()
        shell: bash
        run: |
          if [ -f node_modules/supabase/dist/supabase.js ]; then
            mkdir -p .supabase-local
            result=0
            node node_modules/supabase/dist/supabase.js stop > .supabase-local/ci-stop.log 2>&1 || result=$?
            find .supabase-local -mindepth 1 -maxdepth 1 ! -name '*-evidence.json' ! -name '*.sanitized.log' -exec rm -rf -- {} +
            rm -f .env.local
            if [ "$result" -ne 0 ]; then
              echo 'FAIL: project stack cleanup; raw log withheld because it may contain credentials'
              exit "$result"
            fi
          fi
      - name: Publish sanitized evidence in the job summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
