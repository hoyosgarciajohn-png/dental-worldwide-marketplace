# Validation attempt 6: deterministic delayed responses and unambiguous journal replay.
# Validation attempt 5: stable actor cookies and exact CLI stack identity for recovery.
# Validation attempt 4: Auth recovery gate, accessible labels/contrast and isolated browser fixtures.
# Validation attempt 3: one bounded retry for the observed stack-owner startup timeout.
# Validation attempt 2: reuse enrolled MFA factor across distinct test sessions.
# M2–M6 candidate validation under autonomous implementation authority.
name: Dental marketplace validation
# Stop after success; each job max20minutes, unchanged USD0 billable block.
on:
  push:
    branches: ['validation-marketplace-*']
    paths: [.github/workflows/market-validation.yml]
permissions:
  contents: read
concurrency:
  group: dental-marketplace-validation
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      MARKET_PHASE: full
      SUPABASE_HOME: ${{ github.workspace }}/.supabase-local/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Record exact source and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          docker version --format '{{.Server.Version}}'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Foundation build and HTTP checks
        run: |
          npm run test:unit
          npm run typecheck
          npm run build
          npm run test:http
          npm run test:m1:origin
      - name: Install pinned local browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Actual M0/M1 regression and M2–M6 fictional integration
        run: npm run test:market:docker
      - name: Stop only this project and remove connection credentials
        if: always()
        shell: bash
        run: |
          if [ -f node_modules/supabase/dist/supabase.js ]; then
            mkdir -p .supabase-local
            result=0
            node node_modules/supabase/dist/supabase.js stop > .supabase-local/ci-stop.log 2>&1 || result=$?
            find .supabase-local -mindepth 1 -maxdepth 1 ! -name '*-evidence.json' ! -name '*.sanitized.log' -exec rm -rf -- {} +
            rm -f .env.local
            if [ "$result" -ne 0 ]; then
              echo 'FAIL: project stack cleanup; raw log withheld because it may contain credentials'
              exit "$result"
            fi
          fi
      - name: Publish sanitized evidence in the job summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const path = `.supabase-local/market-${process.env.MARKET_PHASE}-evidence.json`;
          const evidence = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : null;
          const report = {
            source: process.env.GITHUB_SHA,
            job: process.env.JOB_RESULT,
            services: evidence?.result ?? 'NOT PERFORMED',
            evidence,
            limitation: 'Fictional local candidate only. Human checks deferred M7; independent exact-candidate review pending.'
          };
          const json = JSON.stringify(report, null, 2);
          console.log(json);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + json + '\n```\n');
          JS
  load:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
